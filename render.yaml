services:
  - type: web
    name: amazon-price-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: ENABLE_TRACKER
        value: "0"
